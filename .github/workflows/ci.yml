# Render deploys main only after these checks pass (autoDeployTrigger:
# checksPass in render.yaml), so this workflow is the gate to production.
# Actions are pinned by commit SHA.

name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run ruff check src evals tests
      - run: uv run ruff format --check src evals tests
      - run: uv run mypy
      - run: uv run pytest -q
