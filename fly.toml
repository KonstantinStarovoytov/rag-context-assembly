# fly.toml app configuration file generated for rag-context-assembly on 2026-09-15T00:18:42+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rag-context-assembly'
primary_region = 'fra'

[build]
[env]
  # The MCP transport answers 421 to Host headers it was not told about.
  API_ALLOWED_HOSTS = 'rag-context-assembly.fly.dev'
  GENERATION_TOP_K = '8'
  PER_QUERY_TOP_K = '20'
  PORT = '8080'
  QDRANT_COLLECTION = 'agent_docs_v2'
  QDRANT_HYBRID_COLLECTION = 'agent_docs_hybrid_v1'
  RETRIEVAL_STRATEGY = 'hybrid'
  RETRIEVAL_TOP_K = '10'
  TRACING_ENABLED = 'true'
  TRANSLATE_NON_ENGLISH = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
