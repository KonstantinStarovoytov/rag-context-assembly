requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cohere>=7.1.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.2",
    "markdownify>=1.2.3",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
